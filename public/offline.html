<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GitHub Achievements - Offline">
  <title>Offline - GitHub Achievements</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta name="theme-color" content="#10b981">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --bg-elevated: #161b22;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #30363d;
      --card-bg: #161b22;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-elevated: #f6f8fa;
        --fg: #24292f;
        --fg-muted: #656d76;
        --accent: #0969da;
        --accent-hover: #0860ca;
        --border: #d0d7de;
        --card-bg: #ffffff;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      color: var(--accent);
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--fg);
    }

    p {
      color: var(--fg-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    .card-text {
      font-size: 0.875rem;
      color: var(--fg-muted);
      margin: 0;
    }

    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      width: 100%;
      max-width: 280px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .secondary {
      margin-top: 1rem;
      color: var(--fg-muted);
      font-size: 0.875rem;
    }

    .secondary a {
      color: var(--accent);
      text-decoration: none;
    }

    .secondary a:hover {
      text-decoration: underline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <title>Offline icon</title>
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 12 18.92"></path>
        <path d="M5 12.71V12a10 10 0 0 1 20 0v.71"></path>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features may be unavailable.</p>

    <div class="card">
      <div class="card-title">What you can do:</div>
      <p class="card-text">Previously visited pages are cached and available offline. Try navigating to a page you've seen before, or wait for connection to restore.</p>
    </div>

    <button id="retryBtn" type="button">
      <span class="loading hidden" aria-hidden="true"></span>
      <span id="btnText">Try Again</span>
    </button>

    <p class="secondary">
      Or <a href="/" id="homeLink">go to homepage</a>
    </p>
  </div>

  <script>
    (() => {
      const retryBtn = document.getElementById('retryBtn');
      const btnText = document.getElementById('btnText');
      const loader = retryBtn.querySelector('.loading');
      const homeLink = document.getElementById('homeLink');

      let isChecking = false;

      async function checkOnline() {
        if (isChecking) return;
        isChecking = true;

        retryBtn.disabled = true;
        btnText.textContent = 'Checking...';
        loader.classList.remove('hidden');

        try {
          // Try to fetch a small resource to verify connectivity
          // Using the manifest since it's cached and lightweight
          const response = await fetch('/manifest.json', {
            method: 'HEAD',
            cache: 'no-cache'
          });

          if (response.ok || response.type === 'opaque') {
            // Online - reload the page
            window.location.reload();
            return;
          }
        } catch (_error) {
          // Still offline
        } finally {
          isChecking = false;
          retryBtn.disabled = false;
          btnText.textContent = 'Try Again';
          loader.classList.add('hidden');
        }
      }

      retryBtn.addEventListener('click', checkOnline);

      // Listen for online event
      window.addEventListener('online', () => {
        btnText.textContent = 'Connection Restored!';
        loader.classList.remove('hidden');
        setTimeout(() => window.location.reload(), 500);
      });

      // Also check periodically
      setInterval(checkOnline, 30000);

      // Handle home link - let it navigate normally (will use cached version if available)
      homeLink.addEventListener('click', (_e) => {
        // Let the browser handle navigation - SW will serve cached version
      });
    })();
  </script>
</body>
</html>
